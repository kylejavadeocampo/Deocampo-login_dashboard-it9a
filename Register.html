<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Register</title>
</head>
<body>
    <div class="Forms">
        <center><h2 style="font-family: 'Times New Roman', Times, serif;">Register</h2>
            <form action="Login.html">
                    <input class="LoginItem" type="text" id="fullname" name="fullname" placeholder="Full name" required> <br> 
                    <input class="LoginItem" type="text" id="username" name="username" placeholder="Username" required> <br> 
                    <input class="LoginItem" type="email" id="email" name="email" placeholder="example@gmail.com" required> <br>
                    <input class="LoginItem" type="password" id="password" name="password" placeholder="Password" required> <br>
                    <em>Already have an account? <a href="Login.html"> login here.</a></em> <br> 
                    <button type="submit">Create</button>
            </form>
        </center>
    </div>
</body>
</html>
